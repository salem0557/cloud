name: Saudi stores probe

on:
  workflow_dispatch:
    inputs:
      only:
        description: "أسماء المتاجر (مثلاً: mahally jarir) — فاضي = الكل"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - run: python amazon_deals/probe_stores.py
        env:
          PROBE_ONLY: ${{ inputs.only }}
